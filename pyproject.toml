[project]
name = "edth-agent"
version = "0.1.0"
description = "Hackathon agent: problem statement CSV to problem/solution pitch deck"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "python-pptx>=0.6.21",
    "Pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
